<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phàm Nhân Tu Tiên - Thực Chiến</title>
    <style>
        body { margin: 0; background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; }
        h1 { margin-top: 10px; margin-bottom: 10px; color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        #game-wrapper { display: flex; gap: 20px; margin-top: 10px; position: relative; }
        canvas { background: #1e293b url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=800&auto=format&fit=crop') center/cover; border: 3px solid #334155; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        #ui-panel { width: 280px; padding: 20px; background: #1e293b; border: 2px solid #334155; border-radius: 8px; }
        .stat-box { margin-bottom: 15px; padding: 10px; background: #0f172a; border-radius: 6px; }
        #inventory { margin-top: 20px; border-top: 2px solid #334155; padding-top: 15px; }
        .item { display: inline-block; background: #b45309; color: #fff; padding: 5px 10px; border-radius: 4px; margin: 3px; font-size: 14px; }
        
        #character-selection { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; border-radius: 8px; }
        .char-grid { display: flex; gap: 15px; margin-top: 20px; }
        .char-card { cursor: pointer; text-align: center; background: #334155; padding: 10px; border-radius: 8px; border: 2px solid transparent; transition: 0.3s; }
        .char-card:hover { border-color: #38bdf8; transform: translateY(-5px); }
        .char-card img { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; margin-bottom: 10px; border: 2px solid #64748b; }
        
        #combat-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e293b; border: 2px solid #ef4444; padding: 20px; border-radius: 8px; text-align: center; z-index: 20; width: 300px; box-shadow: 0 0 30px rgba(239, 68, 68, 0.4); }
        .btn { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn:hover { background: #dc2626; }
    </style>
</head>
<body>

    <h1>Phàm Nhân Tu Tiên</h1>
    
    <div id="game-wrapper">
        <!-- Màn hình chọn nhân vật -->
        <div id="character-selection">
            <h2>Chọn Nhân Vật Tu Tiên</h2>
            <div class="char-grid" id="char-grid"></div>
        </div>

        <!-- Khung chiến đấu -->
        <div id="combat-modal">
            <h2 style="color: #ef4444">Chạm Trán Boss!</h2>
            <p id="combat-log">Ngươi vừa gặp Mặc Giao. Sinh tử quyết chiến!</p>
            <button class="btn" id="attack-btn">Tấn Công (Tỉ lệ thắng 50%)</button>
        </div>

        <!-- Bản đồ Game -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- Bảng thông tin -->
        <div id="ui-panel">
            <div class="stat-box">
                <h3 style="margin-top:0; color: #38bdf8;">Thông Tin</h3>
                <p>Nhân vật: <strong id="ui-name">Chưa chọn</strong></p>
                <p>Cảnh giới: <strong id="ui-level" style="color: #a855f7;">Luyện Khí Kỳ</strong></p>
                <p>Hướng dẫn: Dùng phím <b>W A S D</b> hoặc <b>Mũi tên</b> để di chuyển đến chỗ Boss (Hình vuông đỏ).</p>
            </div>
            
            <div id="inventory">
                <h3 style="margin-top:0; color: #fbbf24;">Túi Đồ (Vật phẩm)</h3>
                <div id="items-list">
                    <i>Túi đồ trống...</i>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CẤU HÌNH NHÂN VẬT (BẠN CÓ THỂ ĐỔI LINK ẢNH TẠI ĐÂY)
        const characters = [
            { id: 'hanlap', name: 'Hàn Lập', img: 'https://ui-avatars.com/api/?name=Han+Lap&background=0D8ABC&color=fff&size=100' },
            { id: 'namcung', name: 'Nam Cung Uyển', img: 'https://ui-avatars.com/api/?name=NC+Uyen&background=f472b6&color=fff&size=100' },
            { id: 'lephivu', name: 'Lệ Phi Vũ', img: 'https://ui-avatars.com/api/?name=Le+Phi+Vu&background=475569&color=fff&size=100' },
            { id: 'tulinh', name: 'Tử Linh', img: 'https://ui-avatars.com/api/?name=Tu+Linh&background=a855f7&color=fff&size=100' },
            { id: 'ngannguyet', name: 'Ngân Nguyệt', img: 'https://ui-avatars.com/api/?name=Ngan+Nguyet&background=facc15&color=fff&size=100' }
        ];

        const drops = ["Trúc Cơ Đan", "Huyết Ngọc Nhện", "Thanh Trúc Phong Vân Kiếm", "Hư Thiên Đỉnh", "Mộc Linh Căn"];
        
        let player = { x: 50, y: 50, size: 50, speed: 5, imgObj: null, name: '' };
        let boss = { x: 600, y: 400, size: 60, alive: true, imgObj: new Image() };
        boss.imgObj.src = 'https://ui-avatars.com/api/?name=BOSS&background=ef4444&color=fff&size=100'; // Ảnh Boss
        
        let keys = {};
        let inventory = [];
        let inCombat = false;
        let gameLoopId;
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Tạo UI chọn nhân vật
        const charGrid = document.getElementById('char-grid');
        characters.forEach(char => {
            const div = document.createElement('div');
            div.className = 'char-card';
            div.innerHTML = `<img src="${char.img}" alt="${char.name}"><br><b>${char.name}</b>`;
            div.onclick = () => startGame(char);
            charGrid.appendChild(div);
        });

        function startGame(selectedChar) {
            document.getElementById('character-selection').style.display = 'none';
            player.name = selectedChar.name;
            document.getElementById('ui-name').innerText = player.name;
            
            player.imgObj = new Image();
            player.imgObj.src = selectedChar.img;
            
            // Lắng nghe bàn phím
            window.addEventListener('keydown', e => keys[e.key] = true);
            window.addEventListener('keyup', e => keys[e.key] = false);
            
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            if (inCombat) return; // Dừng di chuyển khi đánh nhau
            
            updatePosition();
            checkCollision();
            draw();
            
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function updatePosition() {
            if ((keys['w'] || keys['ArrowUp']) && player.y > 0) player.y -= player.speed;
            if ((keys['s'] || keys['ArrowDown']) && player.y < canvas.height - player.size) player.y += player.speed;
            if ((keys['a'] || keys['ArrowLeft']) && player.x > 0) player.x -= player.speed;
            if ((keys['d'] || keys['ArrowRight']) && player.x < canvas.width - player.size) player.x += player.speed;
        }

        function checkCollision() {
            if (!boss.alive) return;
            // Kiểm tra va chạm (AABB)
            if (player.x < boss.x + boss.size &&
                player.x + player.size > boss.x &&
                player.y < boss.y + boss.size &&
                player.size + player.y > boss.y) {
                startCombat();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Vẽ Boss
            if (boss.alive) {
                ctx.drawImage(boss.imgObj, boss.x, boss.y, boss.size, boss.size);
            }
            
            // Vẽ Người chơi
            if (player.imgObj) {
                ctx.drawImage(player.imgObj, player.x, player.y, player.size, player.size);
            }
        }

        function startCombat() {
            inCombat = true;
            document.getElementById('combat-modal').style.display = 'block';
            document.getElementById('combat-log').innerText = `${player.name} vừa chạm trán Mặc Giao! Sinh tử quyết chiến!`;
            
            // Reset phím để không bị kẹt di chuyển
            keys = {};
        }

        document.getElementById('attack-btn').onclick = () => {
            const win = Math.random() > 0.5; // Tỉ lệ thắng 50%
            const modal = document.getElementById('combat-modal');
            const log = document.getElementById('combat-log');
            
            if (win) {
                const item = drops[Math.floor(Math.random() * drops.length)];
                alert(`Chiến thắng! Ngươi đã chém đầu Mặc Giao và nhận được [${item}]`);
                boss.alive = false;
                inventory.push(item);
                updateInventory();
                
                // Respawn Boss ở vị trí ngẫu nhiên sau 3 giây
                setTimeout(() => {
                    boss.x = Math.random() * (canvas.width - boss.size);
                    boss.y = Math.random() * (canvas.height - boss.size);
                    boss.alive = true;
                }, 3000);

            } else {
                alert(`Thất bại! Ngươi bị Mặc Giao đánh trọng thương, phải lùi lại trị thương.`);
                // Đẩy người chơi ra xa Boss một chút
                player.x = Math.max(0, player.x - 100);
            }
            
            modal.style.display = 'none';
            inCombat = false;
            requestAnimationFrame(gameLoop);
        };

        function updateInventory() {
            const list = document.getElementById('items-list');
            list.innerHTML = '';
            inventory.forEach(item => {
                const span = document.createElement('span');
                span.className = 'item';
                span.innerText = item;
                list.appendChild(span);
            });
        }
    </script>
</body>
</html>
